<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>색상 AI 비전 인식 테스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Design tokens · white-bg, dual-theme ── */
:root {
  --bg:         #ffffff;
  --bg-2:       #f8fafc;
  --bg-3:       #f1f5f9;
  --panel:      #ffffff;
  --border:     #e2e8f0;
  --text:       #1e293b;
  --muted:      #64748b;
  --subtle:     #94a3b8;
  --accent:     #3b82f6;
  --accent-bg:  #eff6ff;
  --success:    #22c55e;
  --warn:       #f59e0b;
  --danger:     #ef4444;
  --sh-sm:      0 1px 2px rgba(0,0,0,.06);
  --sh:         0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --sh-md:      0 4px 12px rgba(0,0,0,.08);
  --r:          12px;
  --r-sm:       8px;
  --r-lg:       18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:         #0f172a;
    --bg-2:       #1e293b;
    --bg-3:       #273549;
    --panel:      #1e293b;
    --border:     #334155;
    --text:       #f1f5f9;
    --muted:      #94a3b8;
    --subtle:     #64748b;
    --accent:     #60a5fa;
    --accent-bg:  rgba(96,165,250,.12);
    --sh-sm:      0 1px 2px rgba(0,0,0,.4);
    --sh:         0 1px 3px rgba(0,0,0,.5);
    --sh-md:      0 4px 12px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:         #0f172a;
  --bg-2:       #1e293b;
  --bg-3:       #273549;
  --panel:      #1e293b;
  --border:     #334155;
  --text:       #f1f5f9;
  --muted:      #94a3b8;
  --subtle:     #64748b;
  --accent:     #60a5fa;
  --accent-bg:  rgba(96,165,250,.12);
  --sh-sm:      0 1px 2px rgba(0,0,0,.4);
  --sh:         0 1px 3px rgba(0,0,0,.5);
  --sh-md:      0 4px 12px rgba(0,0,0,.5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans KR", "Inter", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

.page {
  max-width: 960px;
  margin: 0 auto;
  padding-block: 32px 52px;
}

/* ── Header ── */
.hdr {
  text-align: center;
  margin-bottom: 28px;
}
.hdr h1 {
  font-size: clamp(1.5rem, 4vw, 2.3rem);
  font-weight: 900;
  letter-spacing: -.025em;
  line-height: 1.2;
  text-wrap: balance;
  color: var(--text);
}
.hdr p {
  color: var(--muted);
  margin-top: 6px;
  font-size: .9rem;
}

/* ── Grid ── */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  align-items: start;
}
@media (max-width: 660px) { .grid { grid-template-columns: 1fr; } }

/* ── Card ── */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh);
  overflow: hidden;
}
.card-head {
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.card-ttl {
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
}
.card-body { padding: 16px 18px; }

/* ── Tabs ── */
.tabs {
  display: flex; gap: 3px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 3px;
}
.tab-btn {
  flex: 1; padding: 6px 12px;
  border: none; background: transparent;
  border-radius: calc(var(--r-sm) - 2px);
  cursor: pointer; font: inherit;
  font-size: .83rem; font-weight: 600;
  color: var(--muted);
  transition: background .15s, color .15s;
}
.tab-btn.active {
  background: var(--panel);
  color: var(--text);
  box-shadow: var(--sh-sm);
}
.tab-btn:hover:not(.active) { color: var(--text); }
.tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ── Preview (camera) ── */
.preview-wrap {
  aspect-ratio: 4 / 3;
  background: var(--bg-3);
  border-radius: var(--r);
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  max-width: 100%;
}
#video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}
.preview-ph {
  text-align: center;
  color: var(--subtle);
  padding: 16px;
  pointer-events: none;
  user-select: none;
}
.preview-ph .ph-icon { font-size: 2.4rem; margin-bottom: 6px; }
.preview-ph p { font-size: .85rem; }

/* ── Upload zone ── */
.upload-zone {
  aspect-ratio: 4 / 3;
  border: 2px dashed var(--border);
  border-radius: var(--r);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  text-align: center;
  padding: 20px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
  max-width: 100%;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.upload-zone #img-input {
  position: absolute; inset: 0;
  opacity: 0; cursor: pointer;
  width: 100%; height: 100%;
}
.upload-zone .uz-icon { font-size: 2rem; color: var(--subtle); }
.upload-zone .uz-label { font-size: .88rem; font-weight: 600; color: var(--muted); }
.upload-zone .uz-hint { font-size: .78rem; color: var(--subtle); }

.file-preview-wrap {
  aspect-ratio: 4 / 3;
  background: var(--bg-3);
  border-radius: var(--r);
  overflow: hidden;
  position: relative;
  margin-bottom: 12px;
  max-width: 100%;
}
#img-preview {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 8px 15px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  font: inherit; font-size: .87rem; font-weight: 600;
  cursor: pointer; min-height: 36px;
  transition: background .15s, border-color .15s;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--bg-2); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn-row { display: flex; gap: 7px; flex-wrap: wrap; }

/* ── Status line ── */
.status-ln {
  display: flex; align-items: center; gap: 6px;
  font-size: .8rem; color: var(--muted);
  min-height: 28px; padding-top: 6px;
}
.sdot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--subtle); flex-shrink: 0;
  transition: background .3s;
}
.sdot.on   { background: var(--success); }
.sdot.warn { background: var(--warn); }
.sdot.err  { background: var(--danger); }
.status-ln.err-line { color: var(--danger); }

/* ── Results ── */
.res-header {
  font-size: .75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--subtle); margin-bottom: 6px;
  display: flex; align-items: center; justify-content: space-between;
}
.live-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 99px; padding: 2px 8px;
  font-size: .7rem; font-weight: 600; color: var(--muted);
  letter-spacing: .02em;
}
.ldot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--success);
  animation: lpulse 1.6s ease-in-out infinite;
}
@keyframes lpulse { 0%,100%{opacity:1} 50%{opacity:.35} }

.empty-res {
  text-align: center;
  padding: 36px 16px;
  color: var(--subtle);
}
.empty-res .er-icon { font-size: 2.2rem; margin-bottom: 10px; }
.empty-res p { font-size: .88rem; line-height: 1.5; }

/* result rows */
.res-list { display: flex; flex-direction: column; }
.res-item {
  display: grid;
  grid-template-columns: 32px 1fr 50px;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.res-item:last-child { border-bottom: none; padding-bottom: 4px; }
.res-item.top { padding: 14px 0 12px; }

.swatch {
  width: 32px; height: 32px;
  border-radius: 7px;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.1);
}
.res-item.top .swatch { width: 38px; height: 38px; border-radius: 9px; }

.res-info { min-width: 0; }
.res-name {
  font-size: .93rem; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
  line-height: 1.2; margin-bottom: 4px;
}
.res-item.top .res-name { font-size: 1.06rem; }
.rank-tag {
  font-size: .67rem; font-weight: 700; letter-spacing: .04em;
  padding: 2px 6px; border-radius: 4px;
  background: var(--bg-3); color: var(--muted);
  flex-shrink: 0;
}
.res-item.top .rank-tag { background: var(--accent-bg); color: var(--accent); }
.bar-track {
  height: 5px; border-radius: 3px;
  background: var(--bg-3); overflow: hidden;
}
.bar-fill {
  height: 100%; border-radius: 3px;
  transition: width .35s ease;
  min-width: 2px;
}
.res-pct {
  font-size: .92rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: right;
  color: var(--muted);
  white-space: nowrap;
}
.res-item.top .res-pct { color: var(--accent); font-size: 1.05rem; }

/* ── Settings ── */
.settings-sec { margin-top: 18px; }
.set-toggle {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; color: var(--muted);
  font: inherit; font-size: .87rem; font-weight: 600;
  padding: 8px 0; border: none; background: none;
  transition: color .15s;
}
.set-toggle:hover { color: var(--text); }
.set-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.set-arrow { transition: transform .2s; }
.set-toggle[aria-expanded="true"] .set-arrow { transform: rotate(180deg); }

.set-panel {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 18px;
  display: grid; gap: 12px;
}
.set-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
}
.set-lbl {
  font-size: .83rem; font-weight: 600;
  color: var(--muted); flex-shrink: 0;
  min-width: 76px;
}
select {
  font: inherit; font-size: .84rem;
  padding: 6px 10px; border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--panel); color: var(--text);
  min-height: 34px; min-width: 0; flex: 1;
}
select:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="range"] {
  accent-color: var(--accent);
  width: 120px; cursor: pointer;
}
.thr-val { font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
#model-file-input { display: none; }
.model-st { font-size: .82rem; color: var(--muted); }
.model-st.ok  { color: var(--success); }
.model-st.err { color: var(--danger); }
.model-st.warn { color: var(--warn); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="page">
  <!-- Header -->
  <header class="hdr">
    <h1>색상 AI 비전 인식 테스트</h1>
    <p>Teachable Machine 모델로 웹캠 또는 이미지 파일의 색상을 인식합니다.</p>
  </header>

  <div class="grid">
    <!-- ── Input panel ── -->
    <div class="card">
      <div class="card-head">
        <span class="card-ttl">입력</span>
        <div class="tabs" role="tablist">
          <button class="tab-btn active" data-tab="camera" type="button" role="tab" aria-selected="true">📷 웹캠</button>
          <button class="tab-btn" data-tab="file"   type="button" role="tab" aria-selected="false">🖼️ 파일</button>
        </div>
      </div>

      <div class="card-body">
        <!-- Camera tab -->
        <div id="tab-camera" role="tabpanel">
          <div class="preview-wrap">
            <div class="preview-ph" id="cam-ph">
              <div class="ph-icon">📷</div>
              <p>웹캠 시작을 눌러주세요</p>
            </div>
            <video id="video" autoplay muted playsinline hidden aria-label="웹캠 영상"></video>
          </div>
          <div class="btn-row">
            <button class="btn primary" id="cam-start" type="button">📷 웹캠 시작</button>
            <button class="btn" id="cam-stop" type="button" disabled>⏹ 정지</button>
          </div>
          <div class="status-ln" id="cam-status-ln">
            <span class="sdot" id="cam-dot"></span>
            <span id="cam-status-tx">웹캠 시작을 눌러주세요.</span>
          </div>
        </div>

        <!-- File tab -->
        <div id="tab-file" hidden role="tabpanel">
          <div class="upload-zone" id="upload-zone">
            <input type="file" id="img-input" accept="image/*" aria-label="이미지 파일 선택">
            <div class="uz-icon">📂</div>
            <div class="uz-label">클릭하거나 파일을 드래그하세요</div>
            <div class="uz-hint">JPG · PNG · GIF · WebP 지원</div>
          </div>
          <div class="file-preview-wrap" id="file-prev-wrap" hidden>
            <img id="img-preview" src="" alt="업로드된 이미지">
          </div>
          <div class="btn-row">
            <button class="btn primary" id="analyze-btn" type="button" disabled>🔍 색상 분석</button>
            <button class="btn" id="clear-btn" type="button" hidden>✕ 초기화</button>
          </div>
          <div class="status-ln" id="file-status-ln">
            <span class="sdot" id="file-dot"></span>
            <span id="file-status-tx">이미지를 업로드해주세요.</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Results panel ── -->
    <div class="card">
      <div class="card-head">
        <span class="card-ttl">인식 결과</span>
        <div class="live-badge" id="live-badge" hidden>
          <div class="ldot"></div>
          <span>실시간</span>
        </div>
      </div>
      <div class="card-body">
        <div class="res-header">
          <span>TOP 3 색상</span>
        </div>
        <div id="results" role="status" aria-live="polite">
          <div class="empty-res">
            <div class="er-icon">🎨</div>
            <p>모델을 연결하고 이미지를 입력하면<br>색상 인식 결과가 표시됩니다.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Settings ── -->
  <div class="settings-sec">
    <button class="set-toggle" id="set-toggle" type="button" aria-expanded="false" aria-controls="set-panel">
      ⚙️ 모델 · 카메라 설정
      <span class="set-arrow" aria-hidden="true">▾</span>
    </button>
    <div class="set-panel" id="set-panel" hidden>
      <p id="model-status" class="model-st">모델 파일을 선택하거나, GitHub model 폴더를 구성해주세요.</p>
      <div class="set-row">
        <span class="set-lbl">모델 파일</span>
        <button class="btn" id="model-btn" type="button">🧠 모델 파일 연결</button>
        <input type="file" id="model-file-input" accept=".json,.bin" multiple>
      </div>
      <div class="set-row">
        <span class="set-lbl">카메라</span>
        <select id="cam-select" disabled aria-label="카메라 선택"></select>
      </div>
      <div class="set-row">
        <span class="set-lbl">확신 기준</span>
        <input type="range" id="threshold" min="30" max="95" step="5" value="60" aria-label="확신 기준">
        <strong class="thr-val" id="thr-val" aria-live="polite">60%</strong>
      </div>
    </div>
  </div>

  <noscript><p style="text-align:center;color:#ef4444;margin-top:2rem">JavaScript를 활성화해주세요.</p></noscript>
</div>

<script>
(() => {
  "use strict";

  // ── Color definitions ──
  const COLORS = {
    Red:    { hex: '#ef4444', label: '빨강', en: 'red' },
    Orange: { hex: '#f97316', label: '주황', en: 'orange' },
    Yellow: { hex: '#eab308', label: '노랑', en: 'yellow' },
    Green:  { hex: '#22c55e', label: '초록', en: 'green' },
    Blue:   { hex: '#3b82f6', label: '파랑', en: 'blue' },
    Purple: { hex: '#a855f7', label: '보라', en: 'purple' },
    Black:  { hex: '#1f2937', label: '검정', en: 'black' },
    White:  { hex: '#f8fafc', label: '흰색', en: 'white' },
    Grey:   { hex: '#9ca3af', label: '회색', en: 'grey' },
  };

  // ── State ──
  let model = null, modelLoading = false, modelTask = 0, autoAttempted = false;
  let stream = null, camMode = 'idle'; // 'idle' | 'camera'
  let inputEpoch = 0, camTimer = null, inference = null;
  let smoothed = [], labels = [], modelKind = 'image';
  let lastVideoTime = -1, lastVideoAdv = 0, frameState = 'waiting';
  let inputMode = 'camera'; // 'camera' | 'file'
  let uploadedImg = null;
  const libraryPromises = {};

  // Tiny canvases for inference
  const probeCanvas = document.createElement('canvas');
  probeCanvas.width = probeCanvas.height = 32;
  const probeCtx = probeCanvas.getContext('2d', { willReadFrequently: true });

  const inCtx = (() => { const c = document.createElement('canvas'); c.width = c.height = 400; return c; })();
  const inCtx2d = inCtx.getContext('2d');

  const $ = id => document.getElementById(id);

  // ── Utilities ──
  function moveOf(className) {
    const k = String(className).trim().toLowerCase();
    for (const [key, info] of Object.entries(COLORS)) {
      if (info.en === k || key.toLowerCase() === k) return key;
    }
    return null;
  }

  // ── Render top-3 results ──
  function renderResults(rawPreds, smoothedArr) {
    const container = $('results');
    const liveBadge = $('live-badge');
    liveBadge.hidden = !(inputMode === 'camera' && camMode === 'camera' && model);

    if (!rawPreds || !rawPreds.length) {
      container.innerHTML = `
        <div class="empty-res">
          <div class="er-icon">🎨</div>
          <p>모델을 연결하고 이미지를 입력하면<br>색상 인식 결과가 표시됩니다.</p>
        </div>`;
      return;
    }

    const preds = rawPreds.map((p, i) => ({
      className: p.className,
      probability: smoothedArr ? (smoothedArr[i] ?? p.probability) : p.probability,
    })).sort((a, b) => b.probability - a.probability).slice(0, 3);

    const items = preds.map((p, rank) => {
      const key = moveOf(p.className);
      const info = key ? COLORS[key] : null;
      const pct = Math.round(Math.max(0, Math.min(1, p.probability)) * 100);
      const hex = info ? info.hex : '#888888';
      const label = info ? info.label : p.className;
      const rankLabels = ['1위', '2위', '3위'];
      const barColor = (key === 'White') ? '#cbd5e1' : hex;

      return `<div class="res-item${rank === 0 ? ' top' : ''}">
        <div class="swatch" style="background:${hex}" aria-hidden="true"></div>
        <div class="res-info">
          <div class="res-name">
            ${label}
            <span class="rank-tag">${rankLabels[rank]}</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${pct}%;background:${barColor}"></div>
          </div>
        </div>
        <div class="res-pct">${pct}%</div>
      </div>`;
    }).join('');

    container.innerHTML = `<div class="res-list">${items}</div>`;
  }

  // ── Library loading ──
  const LIBS = {
    image: ['tmImage', '@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js'],
    pose:  ['tmPose',  '@teachablemachine/pose@0.8.6/dist/teachablemachine-pose.min.js'],
  };

  function loadScript(url) {
    return new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = url; s.async = true;
      const t = setTimeout(() => { s.remove(); rej(new Error('스크립트 로드 시간 초과')); }, 14000);
      s.onload = () => { clearTimeout(t); res(); };
      s.onerror = () => { clearTimeout(t); s.remove(); rej(new Error('스크립트 로드 실패')); };
      document.head.append(s);
    });
  }

  async function ensureLibraries(kind) {
    const [g] = LIBS[kind];
    if (window.tf && window[g]) return;
    if (!libraryPromises[kind]) libraryPromises[kind] = (async () => {
      for (const [name, file] of [['tf', '@tensorflow/tfjs@1.3.1/dist/tf.min.js'], LIBS[kind]]) {
        if (window[name]) continue;
        try { await loadScript('https://cdn.jsdelivr.net/npm/' + file); }
        catch { await loadScript('https://unpkg.com/' + file); }
        if (!window[name]) throw new Error('AI 라이브러리 초기화 실패');
      }
    })();
    try { await libraryPromises[kind]; }
    catch { libraryPromises[kind] = null; throw new Error('AI 실행 도구를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.'); }
  }

  function kindOf(meta) {
    const t = JSON.stringify(meta || {}).toLowerCase();
    return (t.includes('teachablemachine/pose') || meta?.modelSettings?.posenet) ? 'pose' : 'image';
  }

  async function readMeta(src) {
    try {
      if (typeof src === 'string') { const r = await fetch(src, { cache: 'no-store' }); return r.ok ? await r.json() : null; }
      return JSON.parse(await src.text());
    } catch { return null; }
  }

  function setModelStatus(text, state = '') {
    const el = $('model-status');
    el.textContent = text;
    el.className = 'model-st' + (state ? ' ' + state : '');
  }

  // ── Model connection ──
  async function connectModel(files) {
    const task = ++modelTask; modelLoading = true; autoAttempted = true;
    const prev = model; model = null; labels = []; smoothed = [];
    setModelStatus('모델 연결 중…');
    let candidate = null;
    try {
      if (inference) await inference.catch(() => {});
      prev?.model?.dispose?.();
      if (task !== modelTask) return;

      if (!files && location.protocol === 'file:')
        throw new Error("'모델 파일 연결'을 눌러 model.json, metadata.json, weights.bin 파일을 함께 선택해주세요.");

      let kind = 'image';
      if (files) {
        const topology  = files.find(f => f.name === 'model.json');
        const metadata  = files.find(f => f.name === 'metadata.json');
        const weights   = files.filter(f => f.name.endsWith('.bin'));
        if (!topology || !metadata || weights.length !== 1)
          throw new Error('model.json, metadata.json, 가중치(.bin) 파일 1개를 한 번에 선택해주세요.');
        kind = kindOf(await readMeta(metadata));
        await ensureLibraries(kind);
        if (task !== modelTask) return;
        const lib = kind === 'pose' ? window.tmPose : window.tmImage;
        candidate = await lib.loadFromFiles(topology, weights[0], metadata);
      } else {
        for (const base of ['./model/', './']) {
          const meta = await readMeta(base + 'metadata.json');
          if (meta) { kind = kindOf(meta); break; }
        }
        await ensureLibraries(kind);
        if (task !== modelTask) return;
        const lib = kind === 'pose' ? window.tmPose : window.tmImage;
        for (const base of ['./model/', './']) {
          try { candidate = await lib.load(base + 'model.json', base + 'metadata.json'); break; }
          catch (err) { console.warn('모델 경로:', base, err); }
        }
        if (!candidate) throw new Error("모델을 찾지 못했습니다. '모델 파일 연결'로 파일 3개를 선택해주세요.");
      }

      if (task !== modelTask) { candidate?.model?.dispose?.(); return; }

      const mLabels = candidate.getClassLabels();
      if (!Array.isArray(mLabels) || !mLabels.length) throw new Error('분류 이름이 없는 모델입니다.');

      model = candidate; labels = mLabels; modelKind = kind; modelLoading = false;

      const missing = Object.keys(COLORS).filter(m => !mLabels.some(l => moveOf(l) === m));
      if (missing.length) {
        setModelStatus(`⚠️ 연결됨 · ${missing.map(m => COLORS[m].label).join('·')} 클래스 없음 · (${mLabels.join(' / ')})`, 'warn');
      } else {
        setModelStatus(`✅ 모델 연결 완료 · ${(kind === 'pose' ? '포즈' : '이미지')} 모델 · ${mLabels.join(' / ')}`, 'ok');
      }

      // auto-analyze if file is loaded
      updateAnalyzeBtn();
      if (inputMode === 'file' && uploadedImg) {
        await analyzeFileImage();
      }
    } catch (e) {
      if (task === modelTask) {
        model = null; modelLoading = false;
        setModelStatus('❌ ' + (e.message || '모델 연결 실패'), 'err');
      }
    } finally {
      if (task === modelTask) modelLoading = false;
    }
  }

  // ── Camera status helpers ──
  function camStatus(text, dotState = '', isErr = false) {
    $('cam-status-tx').textContent = text;
    $('cam-dot').className = 'sdot' + (dotState ? ' ' + dotState : '');
    $('cam-status-ln').className = 'status-ln' + (isErr ? ' err-line' : '');
  }

  function isDarkFrame(pixels) {
    let sum = 0, max = 0; const n = pixels.length / 4;
    if (!n) return false;
    for (let i = 0; i < pixels.length; i += 4) {
      const b = (pixels[i] + pixels[i+1] + pixels[i+2]) / 3;
      sum += b; max = Math.max(max, b);
    }
    return (sum / n < 45) && max < 60;
  }

  function inspectFrame() {
    const vid = $('video');
    const track = stream?.getVideoTracks()[0];
    if (!track || track.readyState === 'ended' || track.muted) return 'waiting';
    if (vid.readyState < 2 || !vid.videoWidth) return 'waiting';
    if (vid.currentTime !== lastVideoTime) { lastVideoTime = vid.currentTime; lastVideoAdv = performance.now(); }
    if (vid.paused || performance.now() - lastVideoAdv > 5000) return 'waiting';
    try {
      probeCtx.drawImage(vid, 0, 0, 32, 32);
      return isDarkFrame(probeCtx.getImageData(0, 0, 32, 32).data) ? 'dark' : 'ready';
    } catch { return 'unreadable'; }
  }

  // ── Camera inference loop ──
  async function classifyFrame(epoch) {
    if (!model || modelLoading || inference || epoch !== inputEpoch || frameState !== 'ready') return;
    const vid = $('video');
    if (!(vid.readyState >= 2 && vid.videoWidth)) return;

    const s = Math.min(vid.videoWidth, vid.videoHeight);
    inCtx2d.save(); inCtx2d.clearRect(0, 0, 400, 400);
    inCtx2d.translate(400, 0); inCtx2d.scale(-1, 1); // mirror
    inCtx2d.drawImage(vid, (vid.videoWidth-s)/2, (vid.videoHeight-s)/2, s, s, 0, 0, 400, 400);
    inCtx2d.restore();

    const activeModel = model, activeTask = modelTask;
    const job = modelKind === 'pose'
      ? activeModel.estimatePose(inCtx).then(async ({ posenetOutput }) => activeModel.predict(posenetOutput))
      : activeModel.predict(inCtx);
    inference = job;
    try {
      const preds = await job;
      if (epoch !== inputEpoch || activeModel !== model || activeTask !== modelTask) return;
      if (!preds.length || preds.some(p => !Number.isFinite(p.probability))) throw new Error('분류 오류');
      preds.forEach((p, i) => {
        const v = Math.max(0, Math.min(1, p.probability));
        smoothed[i] = smoothed[i] === undefined ? v : smoothed[i] * 0.5 + v * 0.5;
      });
      renderResults(preds, smoothed);
    } catch (e) {
      if (epoch === inputEpoch && activeTask === modelTask) {
        model = null; candidate?.model?.dispose?.();
        setModelStatus('AI 분류 오류: ' + e.message, 'err');
      }
    } finally {
      if (inference === job) inference = null;
    }
  }

  async function cameraLoop(epoch) {
    if (epoch !== inputEpoch || camMode !== 'camera' || !stream) return;
    const st = inspectFrame();
    if (st !== frameState) {
      frameState = st;
      const camName = stream.getVideoTracks()[0]?.label || '카메라';
      if (st === 'ready') camStatus(camName + ' · 실시간 인식 중', 'on');
      else if (st === 'dark') camStatus('영상이 너무 어둡습니다. 카메라 가림막을 확인해주세요.', 'warn');
      else camStatus('카메라 영상을 기다리고 있습니다…');
    }
    if (st === 'ready') await classifyFrame(epoch);
    if (epoch === inputEpoch && camMode === 'camera') {
      camTimer = setTimeout(() => cameraLoop(epoch), 120);
    }
  }

  function resetCamera() {
    inputEpoch++;
    clearTimeout(camTimer); camTimer = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    const vid = $('video');
    vid.pause(); vid.srcObject = null; vid.hidden = true;
    $('cam-ph').hidden = false;
    camMode = 'idle'; smoothed = []; frameState = 'waiting';
    lastVideoTime = -1; lastVideoAdv = 0;
    $('cam-start').disabled = false;
    $('cam-stop').disabled = true;
    $('cam-select').disabled = true;
    camStatus('웹캠 시작을 눌러주세요.');
    if (inputMode === 'camera') renderResults(null);
    $('live-badge').hidden = true;
  }

  async function startCamera() {
    resetCamera();
    const epoch = inputEpoch;
    $('cam-start').disabled = true;
    camStatus('카메라 권한을 요청합니다…');
    try {
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia)
        throw Object.assign(new Error('이 페이지에서 카메라를 사용할 수 없습니다. HTTPS 주소로 접속해주세요.'), { name: 'SecurityError' });
      const deviceId = $('cam-select').value;
      const acquired = await navigator.mediaDevices.getUserMedia({
        video: deviceId ? { deviceId: { exact: deviceId } } : true, audio: false
      });
      if (epoch !== inputEpoch) { acquired.getTracks().forEach(t => t.stop()); return; }
      stream = acquired; camMode = 'camera'; lastVideoAdv = performance.now();
      const vid = $('video');
      vid.srcObject = stream; vid.hidden = false;
      $('cam-ph').hidden = true;
      await vid.play();
      if (epoch !== inputEpoch) return;
      $('cam-stop').disabled = false;
      $('cam-select').disabled = false;
      refreshCameras(epoch);
      for (const t of stream.getVideoTracks()) {
        t.addEventListener('ended', () => { if (epoch === inputEpoch) { resetCamera(); camStatus('카메라 연결이 종료됐습니다.', 'err', true); } });
      }
      if (!model && !modelLoading && !autoAttempted) connectModel();
      $('live-badge').hidden = false;
      void cameraLoop(epoch);
    } catch (e) {
      if (epoch === inputEpoch) {
        const msgs = {
          NotAllowedError:  '카메라 권한이 차단됐습니다. 주소창 왼쪽 설정에서 허용해주세요.',
          NotFoundError:    '카메라를 찾지 못했습니다. 웹캠 연결을 확인해주세요.',
          NotReadableError: '카메라를 열 수 없습니다. 다른 앱이 사용 중일 수 있습니다.',
          SecurityError:    e.message,
        };
        resetCamera();
        camStatus(msgs[e.name] || e.message, 'err', true);
        $('cam-start').disabled = false;
      }
    }
  }

  async function refreshCameras(epoch) {
    if (!navigator.mediaDevices?.enumerateDevices) return;
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      if (epoch !== undefined && epoch !== inputEpoch) return;
      const sel = $('cam-select');
      const prev = sel.value;
      sel.replaceChildren();
      const def = document.createElement('option'); def.value = ''; def.textContent = '기본 카메라'; sel.append(def);
      devices.filter(d => d.kind === 'videoinput' && d.deviceId).forEach((d, i) => {
        const o = document.createElement('option'); o.value = d.deviceId;
        o.textContent = d.label || '카메라 ' + (i + 1); sel.append(o);
      });
      if (Array.from(sel.options).some(o => o.value === prev)) sel.value = prev;
    } catch {}
  }

  // ── File upload ──
  function fileStatus(text, dotState = '', isErr = false) {
    $('file-status-tx').textContent = text;
    $('file-dot').className = 'sdot' + (dotState ? ' ' + dotState : '');
    $('file-status-ln').className = 'status-ln' + (isErr ? ' err-line' : '');
  }

  function updateAnalyzeBtn() {
    $('analyze-btn').disabled = !model || !uploadedImg;
  }

  async function analyzeFileImage() {
    if (!model || !uploadedImg) {
      if (!model) fileStatus('모델을 먼저 연결해주세요.', 'warn');
      return;
    }
    fileStatus('색상 분석 중…');
    try {
      const img = uploadedImg;
      const s = Math.min(img.naturalWidth || img.width, img.naturalHeight || img.height);
      inCtx2d.clearRect(0, 0, 400, 400);
      inCtx2d.drawImage(img, ((img.naturalWidth || img.width) - s) / 2, ((img.naturalHeight || img.height) - s) / 2, s, s, 0, 0, 400, 400);
      let preds;
      if (modelKind === 'pose') {
        const { posenetOutput } = await model.estimatePose(inCtx);
        preds = await model.predict(posenetOutput);
      } else {
        preds = await model.predict(inCtx);
      }
      renderResults(preds, null);
      fileStatus('분석 완료', 'on');
    } catch (e) {
      fileStatus('분석 오류: ' + (e.message || '알 수 없는 오류'), 'err', true);
    }
  }

  function loadImage(file) {
    if (!file || !file.type.startsWith('image/')) {
      fileStatus('이미지 파일(JPG, PNG 등)만 지원합니다.', 'err', true);
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      const img = $('img-preview');
      img.onload = () => {
        uploadedImg = img;
        $('upload-zone').hidden = true;
        $('file-prev-wrap').hidden = false;
        $('clear-btn').hidden = false;
        updateAnalyzeBtn();
        if (model) {
          analyzeFileImage();
        } else {
          fileStatus('이미지 로드 완료 · 모델을 연결하면 자동으로 분석됩니다.', 'on');
          if (!autoAttempted) connectModel();
        }
      };
      img.onerror = () => fileStatus('이미지를 불러올 수 없습니다.', 'err', true);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    uploadedImg = null;
    $('img-preview').src = '';
    $('upload-zone').hidden = false;
    $('file-prev-wrap').hidden = true;
    $('clear-btn').hidden = true;
    $('img-input').value = '';
    updateAnalyzeBtn();
    fileStatus('이미지를 업로드해주세요.');
    renderResults(null);
  }

  // ── Tab switching ──
  function switchTab(tab) {
    inputMode = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      const active = btn.dataset.tab === tab;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-selected', String(active));
    });
    $('tab-camera').hidden = tab !== 'camera';
    $('tab-file').hidden   = tab !== 'file';
    if (tab === 'camera') {
      $('live-badge').hidden = !(camMode === 'camera' && model);
    } else {
      $('live-badge').hidden = true;
      if (uploadedImg && model) analyzeFileImage();
      else if (!uploadedImg) renderResults(null);
    }
  }

  // ── Event wiring ──
  $('cam-start').addEventListener('click', () => startCamera());
  $('cam-stop').addEventListener('click', () => { resetCamera(); camStatus('카메라를 정지했습니다.'); });
  $('cam-select').addEventListener('change', () => { if (camMode === 'camera') startCamera(); });

  $('model-btn').addEventListener('click', () => $('model-file-input').click());
  $('model-file-input').addEventListener('change', e => {
    const files = Array.from(e.target.files); e.target.value = '';
    if (files.length) connectModel(files);
  });

  $('threshold').addEventListener('input', () => {
    $('thr-val').textContent = $('threshold').value + '%';
  });

  // Settings panel toggle
  $('set-toggle').addEventListener('click', () => {
    const panel = $('set-panel');
    const isOpen = !panel.hidden;
    panel.hidden = isOpen;
    $('set-toggle').setAttribute('aria-expanded', String(!isOpen));
  });

  // Tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // File input
  $('img-input').addEventListener('change', e => {
    if (e.target.files[0]) loadImage(e.target.files[0]);
  });

  // Drag-and-drop
  const uz = $('upload-zone');
  uz.addEventListener('dragover', e => { e.preventDefault(); uz.classList.add('dragover'); });
  uz.addEventListener('dragleave', e => { if (!uz.contains(e.relatedTarget)) uz.classList.remove('dragover'); });
  uz.addEventListener('drop', e => {
    e.preventDefault(); uz.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f) loadImage(f);
  });

  $('analyze-btn').addEventListener('click', () => analyzeFileImage());
  $('clear-btn').addEventListener('click', () => clearImage());

  navigator.mediaDevices?.addEventListener?.('devicechange', () => refreshCameras());
  window.addEventListener('pagehide', () => { inputEpoch++; if (stream) stream.getTracks().forEach(t => t.stop()); });

  // Auto-connect model on page load
  connectModel();
})();
</script>

</body></html>
